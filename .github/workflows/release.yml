name: Release

# One tag, one release with everything: push `vX.Y.Z` (all components must carry that version,
# see scripts/check-versions.sh). The release contains:
#   - the Python package (wheel + sdist), optionally published to PyPI
#   - Docker images for the node and the gateway on GHCR
#   - desktop installers for Windows, macOS (Apple Silicon + Intel) and Linux
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v4.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check versions match the tag
        run: scripts/check-versions.sh "$TAG"
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          {
            awk "/^## \\[$VERSION\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md
            echo
            echo "## Downloads"
            echo
            echo "| Component | Files |"
            echo "|---|---|"
            echo "| Desktop app | Windows \`.msi\`/\`.exe\` · macOS \`.dmg\` (Apple Silicon and Intel) · Linux \`.deb\`/\`.rpm\`/\`.AppImage\` |"
            echo "| Python node | \`bee2bee-$VERSION-py3-none-any.whl\` · \`bee2bee-$VERSION.tar.gz\` (\`pip install bee2bee-$VERSION-py3-none-any.whl\`) |"
            echo "| Docker | \`ghcr.io/${GITHUB_REPOSITORY,,}/node:$VERSION\` · \`ghcr.io/${GITHUB_REPOSITORY,,}/gateway:$VERSION\` |"
            echo "| Directory server | Deploy \`server/\` from this tag on Vercel (see docs/DEPLOYMENT.md) |"
          } > notes.md
          cat notes.md
      - id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Bee2Bee ${{ env.TAG }}
          body_path: notes.md
          draft: true

  python:
    name: Python package
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          /tmp/wheel-test/bin/bee2bee --version
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  pypi:
    name: Publish to PyPI
    needs: [python]
    # Enable by setting the repository variable PUBLISH_PYPI=true and adding this repository as a
    # trusted publisher for the `bee2bee` project on PyPI (environment: pypi).
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  images:
    name: Docker images
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Node image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.repo }}/node:${{ needs.prepare.outputs.version }},${{ steps.meta.outputs.repo }}/node:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.repo }}/gateway:${{ needs.prepare.outputs.version }},${{ steps.meta.outputs.repo }}/gateway:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: ubuntu-22.04
            args: ""
          - name: Windows
            platform: windows-latest
            args: ""
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS (Intel)
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install system libraries
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_DIRECTORY_URL: ${{ vars.DIRECTORY_URL }}
          # Optional macOS signing and notarization (configure these secrets to enable).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [prepare, python, images, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
