[package]
name = "bee2bee-desktop"
version = "4.1.0"
description = "Bee2Bee desktop: chat with any node, explore the mesh, deploy nodes and models"
edition = "2021"
license-file = "../../LICENSE"

[lib]
name = "bee2bee_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bee2bee-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "signal"] }
tokio-util = "0.7"

[workspace]
members = ["core"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
