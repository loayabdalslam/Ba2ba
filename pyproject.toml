[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bee2bee"
dynamic = ["version"]
description = "Decentralized peer-to-peer network for AI model hosting and inference"
authors = [{ name = "ConnectIT Team", email = "loaiabdalslam@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["p2p", "ai", "llm", "inference", "distributed", "ollama", "transformers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "websockets>=13.0",
  "psutil>=5.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.5",
  "loguru>=0.7.2",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "huggingface-hub>=0.23",
  "cryptography>=42",
]

[project.optional-dependencies]
hf = ["transformers>=4.40", "sentencepiece>=0.2.0", "protobuf>=3.20.0"]
torch = ["torch>=2.1"]
nat = ["miniupnpc>=2.2.5"]
sentry = ["sentry-sdk>=2.0"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://coithub.org"
Source = "https://github.com/Chatit-cloud/BEE2BEE"

[project.scripts]
bee2bee = "bee2bee.__main__:main"

[tool.setuptools]
packages = ["bee2bee"]

[tool.setuptools.dynamic]
version = { attr = "bee2bee._version.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["notebook", "app", "gateway"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "B904", "UP007", "UP045", "UP006", "UP035"]

[tool.ruff.lint.per-file-ignores]
"bee2bee/nat.py" = ["W293", "W291", "E722", "B904", "F841", "ASYNC", "I001", "UP"]
"bee2bee/stun_client.py" = ["W293", "W291", "E722", "B904", "F841", "ASYNC", "I001", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["bee2bee"]
exclude = ["bee2bee/nat.py", "bee2bee/stun_client.py"]
follow_imports = "silent"
check_untyped_defs = false
